name: Minecraft Mod Derleme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Modu derle
        run: gradle build --no-daemon

      - name: JAR dosyasını hazırla
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: build/libs/*.jar
